# ADM ЗДОИ4You – Cloudflare Worker на adm.zdoi.eu: сайтът и API-то (/api/*)
name = "adm-zdoi"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

# целият адрес: сайтът (worker/public, от site/ с tools/build-site.mjs), API-то и проверката на Let's Encrypt
routes = [
  { pattern = "adm.zdoi.eu/*", zone_name = "zdoi.eu" }
]

# сайтът: файловете се сервират преди Worker-а; останалите адреси (/api…) отиват в Worker-а
[assets]
directory = "./public"
binding = "ASSETS"

# входяща поща на приемната – на 5 минути; напомняния за срокове – веднъж на ден след 8:00 ч.
[triggers]
crons = ["*/5 * * * *"]

# сесии, ограничения на опитите и кеш: wrangler kv namespace create adm-zdoi
[[kv_namespaces]]
binding = "KV"
id = "7a5361639ca94fc99f9ae3a528ba8079"

# публични стойности; тайните (PEPPER, SETUP_KEY, MS_PRIVATE_KEY) се задават с wrangler secret put
[vars]
APP_URL = "https://adm.zdoi.eu/"
APP_NAME = "ADM ЗДОИ4You"
SUPPORT = "priemna@zdoi.eu"
MAIL_SENDER = "no-reply@zdoi.eu"
# приемната: изпраща заявленията и получава отговорите на priemna+<етикет на преписката>@zdoi.eu
MAILBOX = "priemna@zdoi.eu"
# https://bulmaileu.sharepoint.com/sites/adm-zdoi – създаден с tools/sp-provision.js
SP_SITE = "bulmaileu.sharepoint.com,c089c092-6209-4a58-a6f1-8a9ff9db54cb,cac3c2b2-5302-4544-a8c0-6ae13823279d"
MS_TENANT = "16d24843-7704-4206-87f4-bc20073547ac"
# приложение „ADM ZDOI4You“ в Entra (tools/entra-setup.js); сертификатът важи до 15.11.2028
MS_CLIENT_ID = "f60efce5-3054-47fa-9edb-8997695e2703"
MS_CERT_SHA1 = "5a495fb0d5719da449e5e4e76936aff03df65676"
MS_CERT_SHA256 = "f4c5bb9523666fa0648495ae02be8269b71d29e558ed0ae1c5c16a09ce592b11"

# вход с външни профили (адрес за връщане: https://adm.zdoi.eu/api/oauth/<google|microsoft|discord>/callback)
# Microsoft: приложение „ADM ZDOI4You – вход“ (tools/oauth-setup.js), само за организацията, със същия сертификат
MS_LOGIN_CLIENT_ID = "d33a4408-fdb0-4d3b-8d34-52634dfb75f5"
# Google и Discord: тайните са GOOGLE_CLIENT_SECRET и DISCORD_CLIENT_SECRET (wrangler secret put)
