# Тестове при всяка промяна; публикуване на Worker-а, когато е включено (променлива на хранилището CF_DEPLOY = true).
name: Worker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # при грешка редовете с нея излизат като анотации (видими и без вход в GitHub)
      - name: Тестове
        run: |
          npm test > test.log 2>&1 || { cat test.log; grep -E "not ok|Error|rror:|expected|actual|AssertionError" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # сайтът се публикува заедно с Worker-а (worker/public)
      - name: Сайт
        run: node tools/build-site.mjs
      - name: wrangler deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
