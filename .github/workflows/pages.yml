# Публикува site/ на GitHub Pages (adm.zdoi.eu) след успешни тестове.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      # Cloudflare кешира js и css: версията на commit-а сменя адресите им
      - name: Версия на файловете
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s/?v=dev/?v=$V/g" site/*.html
          sed -i "s#from './calendar.js'#from './calendar.js?v=$V'#" site/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
